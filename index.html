    function useAnimatedNumber(targetNumber, duration = 1200) {
      const [value, setValue] = useState(0);
      useEffect(() => {
        let startTime = null;
        const target = typeof targetNumber === 'number' ? targetNumber : parseInt(targetNumber.toString().replace(/[^0-9]/g, '')) || 0;
        if (target === 0) return;
        function animate(timestamp) {
          if (!startTime) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);
          const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
          setValue(Math.floor(ease * target));
          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        }
        requestAnimationFrame(animate);
      }, [targetNumber, duration]);
      return value;
    }

                        <div className={`text-[10px] ${textMutedClass} mt-1`}>{st.capital} • {st.districts} Dist.</div>
                      </div>
                    </button>
                  ))}
                </div>

                <div className="pt-2 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    onClick={() => setShowStateModal(false)}
                    className="px-5 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ==========================================================================
              MODAL 3: LEGAL TRUST & DATA PRIVACY GUARANTEE (CENSUS ACT 1948)
             ========================================================================== */}
          {showTrustModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-sm animate-fadeIn">
              <div className={`w-full max-w-lg p-6 sm:p-8 rounded-3xl ${cardBgClass} border border-emerald-500/40 shadow-2xl space-y-4`}>
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">🏛️</span>
                    <h3 className="text-base font-heading font-bold">Statutory Confidentiality Guarantee</h3>
                  </div>
                  <button onClick={() => setShowTrustModal(false)} className="text-slate-400 hover:text-slate-200 text-lg">✕</button>
                </div>

                <div className="space-y-3 text-xs leading-relaxed">
                  <div className="p-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/30">
                    <strong className="text-emerald-700 dark:text-emerald-300 block mb-1">Section 15, Census Act 1948 (Act No. 37 of 1948):</strong>
                    All census records are strictly confidential by law. No individual information can be used as evidence in court or accessed by tax or police authorities.
                  </div>

                  <div className="p-3 rounded-2xl bg-sky-500/10 border border-sky-500/30">
                    <strong className="text-sky-700 dark:text-sky-300 block mb-1">Digital Personal Data Protection (DPDP) Act 2023:</strong>
                    Client-side Zero-Knowledge token hashing and Differential Privacy (ε=0.5) protect raw household records.
                  </div>

                  <div className="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800 border">
                    <strong className="block mb-1">Zero Biometrics Guarantee:</strong>
                    Self-enumeration does not require fingerprints, retina scans, or physical document uploads. Mobile OTP is solely for SMS receipt confirmation and anti-bot verification.
                  </div>
                </div>

                <div className="flex justify-end pt-2">
                  <button
                    onClick={() => setShowTrustModal(false)}
                    className="px-5 py-2 rounded-xl bg-saffron-500 text-slate-950 font-bold text-xs shadow"
                  >
                    I Understand & Feel Safe
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ==========================================
              FOOTER
             ========================================== */}
          <footer className={`mt-12 py-8 border-t ${theme === 'light' ? 'bg-slate-100 border-slate-200 text-slate-600' : 'bg-slate-950 border-slate-800 text-slate-400'} text-xs`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-4">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">🇮🇳</span>
                  <div>
                    <strong className="block text-slate-900 dark:text-slate-100">Census 2027 Portal • डिजिटल जनगणना</strong>
                    <span className="text-[11px] opacity-75">Office of the Registrar General & Census Commissioner, India</span>
                  </div>
                </div>

                <div className="flex flex-wrap gap-3 font-medium text-[11px]">
                  <button onClick={() => setShowTrustModal(true)} className="hover:underline">Legal Guarantee</button>
                  <button onClick={() => setActiveTab('green')} className="hover:underline">Vriksha-Setu Green Offset</button>
                  <button onClick={() => setActiveTab('privacy')} className="hover:underline">DPDP 2023 Shield</button>
                  <button onClick={() => setShowStateModal(true)} className="hover:underline">All 36 States</button>
                </div>
              </div>

              <div className="pt-3 border-t border-slate-200 dark:border-slate-800/80 flex flex-col sm:flex-row items-center justify-between text-[11px] opacity-75">
                <span>© 2026-2027 Office of the Registrar General & Census Commissioner, India.</span>
                <span>Protected by Mobile OTP Anti-Fake Gate & DPDP 2023 Encryption.</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Mount Application to Root DOM
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
